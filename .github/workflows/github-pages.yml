name: Deploy no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_CHAT_API_URL: 'https://portfolio-chat.ws49066.workers.dev'
      # O GitHub Pages não tem rewrites: o 404.html devolve o app para as rotas /resume, /work etc.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      # O GitHub Pages publica o que estiver na branch gh-pages.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
